<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agis Finance AI - v21.0</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- v20: seluruh dependency UI/Firebase dilayani lokal agar app shell bisa dibuka tanpa internet -->
    <script src="./chart.min.js"></script>
    <script src="./sweetalert2.all.min.js"></script>
    <script src="./lucide.min.js"></script>
    <script src="./xlsx.full.min.js"></script>
    <script src="./firebase-app.js"></script>
    <script src="./firebase-firestore.js"></script>
    
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --primary: #2dd4bf;
            --accent: #3b82f6; --danger: #ef4444; --warning: #f59e0b;
            --text: #f8fafc; --text-dim: #94a3b8; --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(30, 41, 59, 0.7);
        }
        body.light-mode {
            --bg: #f8fafc; --surface: #ffffff; --text: #0f172a;
            --text-dim: #64748b; --border: rgba(0,0,0,0.06);
            --glass: rgba(255, 255, 255, 0.8);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg); color: var(--text); padding-bottom: 110px; min-height: 100vh; transition: background 0.3s; overflow-x: hidden; }
        .container { max-width: 500px; margin: auto; padding: 20px; }

        /* Splash Screen */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
            transition: all 0.5s ease;
        }
        .spinner { width: 45px; height: 45px; border: 4px solid var(--surface); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Privacy Blur */
        .blur-active .master-amount, .blur-active .w-val, .blur-active .t-amt, 
        .blur-active #goal-amount, .blur-active #chart-total-val, .blur-active .adv-scrollable {
            filter: blur(12px); pointer-events: none; user-select: none;
        }

        /* Header & Balance */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .status-badge { font-size: 10px; padding: 4px 10px; border-radius: 12px; font-weight: 800; text-transform: uppercase; }
        .status-online { background: rgba(45, 212, 191, 0.15); color: var(--primary); }
        .status-offline { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }
        .btn-icon { background: var(--surface); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .master-balance { text-align: center; margin-bottom: 8px; }
        .master-amount { font-size: clamp(2rem, 9vw, 2.8rem); font-weight: 800; display: block; letter-spacing: -1.5px; }
        .goal-info { text-align: center; font-size: 0.85rem; color: var(--warning); margin-bottom: 30px; font-weight: 600; cursor: pointer; }

        /* Wallet Cards */
        .wallet-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .w-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 18px 8px; display: flex; flex-direction: column; align-items: center; min-width: 0; }
        .w-icon { width: 46px; height: 46px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .w-icon i { width: 22px !important; height: 22px !important; }
        .w-name { font-size: 0.6rem; color: var(--text-dim); font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .w-val { font-size: clamp(0.6rem, 3vw, 0.8rem); font-weight: 800; width: 100%; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Advisor / Smart Insight */
        .advisor { 
            background: var(--surface); border-radius: 28px; padding: 18px; 
            margin: 25px 0; border: 1px solid var(--border); 
            display: flex; gap: 15px; align-items: flex-start; 
            height: 225px; overflow: hidden;
        }
        .adv-icon { width: 44px; height: 44px; background: var(--primary); color: #0f172a; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .adv-main { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .adv-scrollable { flex: 1; overflow-y: auto; font-size: 0.82rem; line-height: 1.6; color: var(--text-dim); }
        .insight-status { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:999px; font-size:0.68rem; font-weight:900; margin-bottom:8px; }
        .insight-safe { background:rgba(45,212,191,.14); color:var(--primary); }
        .insight-warn { background:rgba(245,158,11,.15); color:var(--warning); }
        .insight-danger { background:rgba(239,68,68,.15); color:var(--danger); }
        .insight-row { margin-bottom:7px; }
        .insight-divider { border-top:1px solid var(--border); padding-top:8px; margin-top:4px; }

        /* Transaction List */
        .t-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); }
        .t-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .t-cat-name { font-weight: 700; font-size: 0.95rem; }
        .t-sub-info { font-size: 0.75rem; color: var(--text-dim); display: flex; gap: 6px; }
        .t-amt { font-weight: 800; font-size: 0.9rem; color: var(--danger); display: flex; align-items: center; gap: 8px; }

        /* Navigation */
        .nav-bar { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 75px; background: var(--surface); border-radius: 28px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4); z-index: 1000; border: 1px solid var(--border); max-width: 460px; margin: 0 auto; }
        .nav-item { color: var(--text-dim); cursor: pointer; transition: 0.3s; padding: 10px; }
        .nav-item.active { color: var(--primary); transform: translateY(-5px); }

        .card { background: var(--glass); backdrop-filter: blur(15px); border-radius: 30px; padding: 22px; margin-bottom: 20px; border: 1px solid var(--border); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #0f172a; padding: 18px; border-radius: 18px; border: none; font-weight: 800; width: 100%; cursor: pointer; }
        
        /* NEW: Calculator UI Pro */
        .calc-toggle { position: fixed; bottom: 110px; right: 20px; width: 48px; height: 48px; background: var(--accent); color: white; border-radius: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2000; border: none; box-shadow: 0 8px 15px rgba(0,0,0,0.3); }
        
        #calc-container { 
            position: fixed; bottom: 170px; right: 20px; width: 280px; min-width: 200px; min-height: 350px;
            background: var(--glass); border: 1px solid var(--border); border-radius: 24px; 
            padding: 15px; display: none; z-index: 2001; box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            backdrop-filter: blur(20px); overflow: hidden; touch-action: none;
        }

        .calc-header { cursor: move; padding: 5px; margin-bottom: 12px; display: flex; justify-content: center; background: rgba(255,255,255,0.08); border-radius: 10px; }
        .drag-handle { width: 50px; height: 5px; background: var(--text-dim); border-radius: 10px; opacity: 0.5; }

        .calc-display { width: 100%; background: rgba(0,0,0,0.3); border-radius: 15px; padding: 15px; text-align: right; font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 15px; min-height: 60px; border: 1px solid var(--border); }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; height: calc(100% - 120px); }
        .calc-btn { border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-weight: 700; cursor: pointer; transition: 0.1s; font-size: 1rem; }
        .calc-btn:active { background: var(--primary); color: #000; transform: scale(0.95); }
        .calc-btn.op { background: rgba(59,130,246,0.15); color: var(--accent); }

        .resizer { position: absolute; right: 0; bottom: 0; width: 25px; height: 25px; cursor: nwse-resize; z-index: 2002; }

        .page { display: none; }
        .page.active { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } }
        input, select { width: 100%; padding: 16px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); color: var(--text); margin-bottom: 12px; outline: none; }
    </style>
</head>
<body>

<div id="splash-screen">
    <div class="spinner"></div>
    <h3 style="letter-spacing: 3px; font-weight: 800;">AGIS FINANCE</h3>
    <p style="color:var(--text-dim); font-size:0.8rem; margin-top: 10px;">VERSION 21.0 SMART SYNC</p>
</div>

<div class="container">
    <div id="home" class="page active">
        <div class="header">
            <div style="display:flex; gap:10px; align-items:center">
                <span id="statusBadge" class="status-badge status-online" onclick="flushOutbox()" title="Ketuk untuk coba sinkronisasi" style="cursor:pointer">Online</span>
                <button onclick="togglePrivacy()" class="btn-icon" id="privacyBtn"><i data-lucide="eye"></i></button>
            </div>
            <button onclick="toggleTheme()" class="btn-icon"><i data-lucide="sun-moon"></i></button>
        </div>

        <div class="master-balance">
            <span style="font-size: 0.7rem; color: var(--text-dim); font-weight: 800; text-transform: uppercase;">Saldo Tersedia</span>
            <span class="master-amount" id="total-balance">Rp 0</span>
        </div>
        
        <div class="goal-info" onclick="nav('settings')">
            <i data-lucide="target" style="width:14px; margin-right:5px"></i>
            Tabungan: <span id="goal-amount">Rp 0</span>
        </div>

        <div class="wallet-container">
            <div class="w-card">
                <div class="w-icon" style="background:rgba(45,212,191,0.1)"><i data-lucide="banknote" style="color:var(--primary)"></i></div>
                <span class="w-name">Tunai</span>
                <span class="w-val" id="w-cash">0</span>
            </div>
            <div class="w-card">
                <div class="w-icon" style="background:rgba(59,130,246,0.1)"><i data-lucide="landmark" style="color:var(--accent)"></i></div>
                <span class="w-name">Bank</span>
                <span class="w-val" id="w-bank">0</span>
            </div>
            <div class="w-card">
                <div class="w-icon" style="background:rgba(245,158,11,0.1)"><i data-lucide="smartphone" style="color:var(--warning)"></i></div>
                <span class="w-name">E-Wallet</span>
                <span class="w-val" id="w-e">0</span>
            </div>
        </div>

        <div class="advisor">
            <div class="adv-icon"><i data-lucide="sparkles"></i></div>
            <div class="adv-main">
                <span style="font-weight:800; color:var(--primary); font-size:0.85rem; margin-bottom:5px">Smart Insight</span>
                <div id="advisorContent" class="adv-scrollable">Menganalisa data...</div>
            </div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center">
                <div style="font-weight:700; display:flex; align-items:center; gap:8px"><i data-lucide="pie-chart"></i> Pengeluaran</div>
                <div id="chart-total-val" style="font-weight:800; color:var(--danger)">Rp 0</div>
            </div>
            <div style="height:220px;"><canvas id="pieChart"></canvas></div>
        </div>
    </div>

    <div id="history" class="page">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
                <h2 style="font-size:1rem; font-weight:700">Riwayat</h2>
                <button onclick="exportToExcel()" style="padding:8px 15px; border-radius:12px; background:#22c55e; color:white; border:none; font-size:0.7rem; font-weight:800; cursor:pointer">XLSX</button>
            </div>
            <input type="month" id="filterMonth" onchange="renderAll()">
            <div id="transList" style="max-height: 450px; overflow-y: auto;"></div>
        </div>
    </div>

    <div id="add" class="page">
        <div class="card">
            <h2 style="font-size:1rem; font-weight:700; margin-bottom:18px">Catat Baru</h2>
            <form id="transForm">
                <input type="date" id="t-date">
                <select id="t-wallet">
                    <option value="Tunai">💰 Tunai</option><option value="Bank">🏦 Bank</option><option value="E-Wallet">📱 E-Wallet</option>
                </select>
                <select id="t-cat">
                    <option>Makan & Minum</option><option>Transportasi</option><option>Belanja</option><option>Tagihan</option><option>Hiburan</option><option>Lainnya</option>
                </select>
                <input type="text" id="t-amount-display" placeholder="Nominal" inputmode="numeric" oninput="formatInput(this)">
                <input type="hidden" id="t-amount"> 
            </form>
            <button class="btn-primary" onclick="saveTransaction()"><i data-lucide="check-circle"></i> Simpan</button>
        </div>
    </div>

    <div id="settings" class="page">
        <div class="card">
            <h2 style="font-size:1rem; font-weight:700; margin-bottom:18px">Update Saldo</h2>
            <input type="text" id="set-cash" placeholder="Saldo Tunai" inputmode="numeric" autocomplete="off" oninput="formatMoneyField(this)">
            <input type="text" id="set-bank" placeholder="Saldo Bank" inputmode="numeric" autocomplete="off" oninput="formatMoneyField(this)">
            <input type="text" id="set-e" placeholder="Saldo E-Wallet" inputmode="numeric" autocomplete="off" oninput="formatMoneyField(this)">
            <button class="btn-primary" onclick="updateWallets()">Simpan Saldo</button>
        </div>
        <div class="card">
            <h2 style="font-size:1rem; font-weight:700; margin-bottom:18px">Tabungan & Limit</h2>
            <input type="text" id="goal-input" placeholder="Target Tabungan" inputmode="numeric" autocomplete="off" oninput="formatMoneyField(this)">
            <button class="btn-primary" style="background:var(--warning); color:#000" onclick="setGoal()">Update Target</button>
            <div style="margin-top:20px; border-top:1px solid var(--border); padding-top:20px">
                <select id="l-cat"><option>Makan & Minum</option><option>Transportasi</option><option>Belanja</option><option>Tagihan</option><option>Hiburan</option></select>
                <input type="text" id="l-amount" placeholder="Limit Bulanan" inputmode="numeric" autocomplete="off" oninput="formatMoneyField(this)">
                <button class="btn-primary" style="background:var(--danger)" onclick="setLimit()">Pasang Limit</button>
            </div>
        </div>
    </div>
</div>

<button class="calc-toggle" onclick="toggleCalc()"><i data-lucide="calculator"></i></button>
<div id="calc-container">
    <div class="calc-header" id="calcHeader"><div class="drag-handle"></div></div>
    <div class="calc-display" id="calcDisplay">0</div>
    <div class="calc-grid">
        <button class="calc-btn op" onclick="calcClear()">C</button>
        <button class="calc-btn op" onclick="calcPush('/')">/</button>
        <button class="calc-btn op" onclick="calcPush('*')">×</button>
        <button class="calc-btn op" onclick="calcPop()"><i data-lucide="delete" style="width:18px"></i></button>
        <button class="calc-btn" onclick="calcPush('7')">7</button>
        <button class="calc-btn" onclick="calcPush('8')">8</button>
        <button class="calc-btn" onclick="calcPush('9')">9</button>
        <button class="calc-btn op" onclick="calcPush('-')">-</button>
        <button class="calc-btn" onclick="calcPush('4')">4</button>
        <button class="calc-btn" onclick="calcPush('5')">5</button>
        <button class="calc-btn" onclick="calcPush('6')">6</button>
        <button class="calc-btn op" onclick="calcPush('+')">+</button>
        <button class="calc-btn" onclick="calcPush('1')">1</button>
        <button class="calc-btn" onclick="calcPush('2')">2</button>
        <button class="calc-btn" onclick="calcPush('3')">3</button>
        <button class="calc-btn" style="background:var(--primary); color:#000; grid-row: span 2;" onclick="calcEqual()">=</button>
        <button class="calc-btn" style="grid-column: span 2;" onclick="calcPush('0')">0</button>
        <button class="calc-btn" onclick="calcPush('.')">.</button>
    </div>
    <div class="resizer" id="calcResizer"></div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="nav('home', this)"><i data-lucide="layout-grid"></i></div>
    <div class="nav-item" onclick="nav('history', this)"><i data-lucide="receipt"></i></div>
    <div class="nav-item" onclick="nav('add', this)"><i data-lucide="plus-circle" style="width:30px; height:30px; color:var(--primary)"></i></div>
    <div class="nav-item" onclick="nav('settings', this)"><i data-lucide="sliders"></i></div>
</nav>

<script>
    // --- FIREBASE v8 LOCAL (v20) ---
    const firebaseConfig = { apiKey: "AIzaSyDBrKNaJsfGEVHSsPj9xWCPzZCsO_8UUJ8", authDomain: "trackingmoney-bb785.firebaseapp.com", projectId: "trackingmoney-bb785", storageBucket: "trackingmoney-bb785.firebasestorage.app", messagingSenderId: "725272276839", appId: "1:725272276839:web:d95f1643629c97edae09c2" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const FieldValue = firebase.firestore.FieldValue;

    let store = { trans: [], wallets: { Tunai: 0, Bank: 0, "E-Wallet": 0 }, goal: 0, limits: {} };
    let pieChart;
    let syncInProgress = false;
    let lastSyncError = '';
    const LOCAL_SNAPSHOT_KEY = 'agis_finance_snapshot_v21';
    const LEGACY_SNAPSHOT_KEYS = ['agis_finance_snapshot_v20_1'];
    const OUTBOX_KEY = 'agis_finance_outbox_v21';
    const moneyFormatter = new Intl.NumberFormat('id-ID');
    const fmt = (n) => "Rp " + moneyFormatter.format(Number(n) || 0);

    function normalizeWallets(wallets = {}) {
        return {
            Tunai: Number(wallets.Tunai) || 0,
            Bank: Number(wallets.Bank) || 0,
            "E-Wallet": Number(wallets["E-Wallet"]) || 0
        };
    }

    // Mirror lokal sebagai fallback tambahan di atas cache IndexedDB Firestore.
    // Tujuannya: setelah reload tanpa internet, saldo terakhir langsung tersedia dan tidak kembali ke Rp 0.
    function persistLocalSnapshot() {
        try {
            localStorage.setItem(LOCAL_SNAPSHOT_KEY, JSON.stringify({
                wallets: normalizeWallets(store.wallets),
                goal: Number(store.goal) || 0,
                limits: store.limits || {},
                trans: Array.isArray(store.trans) ? store.trans.slice(0, 1500) : [],
                savedAt: Date.now()
            }));
        } catch (err) {
            console.warn('Local snapshot gagal disimpan:', err);
        }
    }

    function restoreLocalSnapshot() {
        try {
            let raw = localStorage.getItem(LOCAL_SNAPSHOT_KEY);
            if (!raw) {
                for (const key of LEGACY_SNAPSHOT_KEYS) {
                    raw = localStorage.getItem(key);
                    if (raw) break;
                }
            }
            if (!raw) return false;
            const cached = JSON.parse(raw);
            store.wallets = normalizeWallets(cached.wallets);
            store.goal = Number(cached.goal) || 0;
            store.limits = cached.limits && typeof cached.limits === 'object' ? cached.limits : {};
            store.trans = Array.isArray(cached.trans) ? cached.trans : [];
            persistLocalSnapshot();
            return true;
        } catch (err) {
            console.warn('Local snapshot gagal dibaca:', err);
            return false;
        }
    }

    function readOutbox() {
        try {
            const parsed = JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]');
            return Array.isArray(parsed) ? parsed : [];
        } catch (err) {
            console.warn('Outbox gagal dibaca:', err);
            return [];
        }
    }

    function writeOutbox(queue) {
        try {
            localStorage.setItem(OUTBOX_KEY, JSON.stringify(queue));
        } catch (err) {
            console.error('Outbox gagal disimpan:', err);
        }
        updateNetworkStatus();
    }

    function enqueueSync(op) {
        const queue = readOutbox();
        if (!queue.some(item => item.opId === op.opId)) queue.push(op);
        writeOutbox(queue);
    }

    function mergePendingTransactions(cloudTransactions) {
        const queue = readOutbox();
        const pendingDeletes = new Set(queue.filter(op => op.type === 'deleteExpense').map(op => op.expenseId));
        const byId = new Map(cloudTransactions.filter(t => !pendingDeletes.has(t.id)).map(t => [t.id, t]));
        queue.filter(op => op.type === 'addExpense').forEach(op => {
            if (!pendingDeletes.has(op.expenseId) && !byId.has(op.expenseId)) {
                byId.set(op.expenseId, { id: op.expenseId, ...op.data, pendingSync: true });
            }
        });
        return [...byId.values()].sort((a, b) => String(b.tanggal || '').localeCompare(String(a.tanggal || '')));
    }

    async function refreshFromServer() {
        if (!navigator.onLine || readOutbox().length) return;
        try {
            const [walletSnap, goalSnap, limitsSnap, transSnap] = await Promise.all([
                db.collection('config').doc('wallets').get({ source: 'server' }),
                db.collection('config').doc('goal').get({ source: 'server' }),
                db.collection('config').doc('limits').get({ source: 'server' }),
                db.collection('pengeluaran').orderBy('tanggal', 'desc').get({ source: 'server' })
            ]);
            if (walletSnap.exists) store.wallets = normalizeWallets(walletSnap.data());
            if (goalSnap.exists) store.goal = Number(goalSnap.data().amount) || 0;
            if (limitsSnap.exists) store.limits = limitsSnap.data() || {};
            store.trans = transSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            persistLocalSnapshot();
            renderAll();
        } catch (err) {
            console.warn('Refresh server tertunda:', err);
        }
    }

    async function flushOutbox() {
        if (syncInProgress || !navigator.onLine) return;
        let queue = readOutbox();
        if (!queue.length) { updateNetworkStatus(); return; }

        syncInProgress = true;
        lastSyncError = '';
        updateNetworkStatus();

        try {
            while (navigator.onLine && queue.length) {
                const op = queue[0];
                const walletRef = db.collection('config').doc('wallets');

                if (op.type === 'addExpense' || op.type === 'deleteExpense') {
                    const expenseRef = db.collection('pengeluaran').doc(op.expenseId);
                    await db.runTransaction(async transaction => {
                        const expenseSnap = await transaction.get(expenseRef);

                        if (op.type === 'addExpense') {
                            // Idempotent: bila dokumen sudah ada, retry tidak memotong saldo lagi.
                            if (expenseSnap.exists) return;
                            transaction.set(walletRef, { [op.data.dompet]: FieldValue.increment(-Number(op.data.nominal || 0)) }, { merge: true });
                            transaction.set(expenseRef, op.data);
                        } else {
                            // Bila sudah terhapus di server, retry tidak mengembalikan saldo dua kali.
                            if (!expenseSnap.exists) return;
                            const serverData = expenseSnap.data() || {};
                            const wallet = serverData.dompet || op.wallet;
                            const nominal = Number(serverData.nominal || op.nominal || 0);
                            transaction.set(walletRef, { [wallet]: FieldValue.increment(nominal) }, { merge: true });
                            transaction.delete(expenseRef);
                        }
                    });
                } else if (op.type === 'setWallets') {
                    await walletRef.set(normalizeWallets(op.data));
                } else if (op.type === 'setGoal') {
                    await db.collection('config').doc('goal').set({ amount: Number(op.amount) || 0 });
                } else if (op.type === 'setLimit') {
                    await db.collection('config').doc('limits').set({ [op.category]: Number(op.amount) || 0 }, { merge: true });
                }

                queue.shift();
                writeOutbox(queue);
            }
        } catch (err) {
            lastSyncError = err?.message || 'Sinkronisasi gagal';
            console.warn('Outbox sync:', err);
        } finally {
            syncInProgress = false;
            updateNetworkStatus();
            if (!readOutbox().length) refreshFromServer();
            else if (navigator.onLine) setTimeout(flushOutbox, 10000);
        }
    }

    function localDateKey(date = new Date()) {

        return `${y}-${m}-${d}`;
    }

    function dateFromKey(key) {
        const [y, m, d] = String(key || '').split('-').map(Number);
        return new Date(y || 1970, (m || 1) - 1, d || 1);
    }

    function sumRange(transactions, start, end) {
        return transactions.reduce((sum, t) => {
            if (!t.tanggal) return sum;
            const dt = dateFromKey(t.tanggal);
            return dt >= start && dt <= end ? sum + Number(t.nominal || 0) : sum;
        }, 0);
    }

    function buildSmartInsight(disposable, cats, remainingDays) {
        const today = new Date();
        today.setHours(23, 59, 59, 999);
        const start7 = new Date(today); start7.setDate(start7.getDate() - 6); start7.setHours(0,0,0,0);
        const prevEnd = new Date(start7); prevEnd.setMilliseconds(-1);
        const prevStart = new Date(start7); prevStart.setDate(prevStart.getDate() - 7); prevStart.setHours(0,0,0,0);
        const relevant = store.trans.filter(t => t.tanggal && dateFromKey(t.tanggal) <= today);
        const last7 = sumRange(relevant, start7, today);
        const prev7 = sumRange(relevant, prevStart, prevEnd);
        const avg7 = last7 / 7;
        const safeDaily = disposable > 0 && remainingDays > 0 ? disposable / remainingDays : 0;
        const daysAfterToday = Math.max(remainingDays - 1, 0);
        const predictedEnd = disposable - (avg7 * daysAfterToday);

        let status = 'AMAN', statusClass = 'insight-safe', statusIcon = '🟢';
        if (disposable <= 0 || predictedEnd < 0) {
            status = 'KRITIS'; statusClass = 'insight-danger'; statusIcon = '🔴';
        } else if (avg7 > safeDaily * 1.15 && avg7 > 0) {
            status = 'WASPADA'; statusClass = 'insight-warn'; statusIcon = '🟡';
        }

        let comparison = 'Belum cukup data pembanding.';
        if (prev7 > 0) {
            const pct = ((last7 - prev7) / prev7) * 100;
            comparison = pct > 0
                ? `7 hari terakhir naik <b>${Math.abs(pct).toFixed(0)}%</b> dari 7 hari sebelumnya.`
                : pct < 0
                    ? `7 hari terakhir turun <b>${Math.abs(pct).toFixed(0)}%</b> dari 7 hari sebelumnya.`
                    : 'Pengeluaran 7 hari terakhir sama dengan periode sebelumnya.';
        } else if (last7 > 0) {
            comparison = `7 hari terakhir keluar <b>${fmt(last7)}</b>; periode sebelumnya belum punya data.`;
        }

        const topCategory = Object.entries(cats).sort((a,b) => b[1] - a[1])[0];
        const topText = topCategory ? `${escapeHtml(topCategory[0])} — <b>${fmt(topCategory[1])}</b>` : 'Belum ada pengeluaran bulan ini.';

        return { safeDaily, avg7, predictedEnd, status, statusClass, statusIcon, comparison, topText };
    }

    // --- CALCULATOR PRO LOGIC (tanpa eval) ---
    let calcExpr = "";
    window.toggleCalc = () => {

    };
    window.calcPush = (v) => { calcExpr += v; document.getElementById('calcDisplay').innerText = calcExpr; };
    window.calcClear = () => { calcExpr = ""; document.getElementById('calcDisplay').innerText = "0"; };
    window.calcPop = () => { calcExpr = calcExpr.slice(0,-1); document.getElementById('calcDisplay').innerText = calcExpr || "0"; };

    function calculateExpression(expression) {
        const tokens = expression.match(/\d*\.?\d+|[+\-*/]/g);
        if (!tokens || tokens.join('') !== expression) throw new Error('Invalid expression');
        const values = [];
        const ops = [];
        const prec = { '+':1, '-':1, '*':2, '/':2 };
        const apply = () => {
            const b = values.pop(), a = values.pop(), op = ops.pop();
            if (!Number.isFinite(a) || !Number.isFinite(b)) throw new Error('Invalid operands');
            if (op === '+') values.push(a + b);
            else if (op === '-') values.push(a - b);
            else if (op === '*') values.push(a * b);
            else if (op === '/') {
                if (b === 0) throw new Error('Division by zero');
                values.push(a / b);
            }
        };
        let expectNumber = true;
        for (const token of tokens) {
            if (/^\d/.test(token) || token.startsWith('.')) {
                if (!expectNumber) throw new Error('Missing operator');
                values.push(Number(token));
                expectNumber = false;
            } else {
                if (expectNumber) throw new Error('Missing number');
                while (ops.length && prec[ops[ops.length - 1]] >= prec[token]) apply();
                ops.push(token);
                expectNumber = true;
            }
        }
        if (expectNumber) throw new Error('Trailing operator');
        while (ops.length) apply();
        if (values.length !== 1 || !Number.isFinite(values[0])) throw new Error('Invalid result');
        return values[0];
    }

    window.calcEqual = () => {

    // --- DRAG & RESIZE LOGIC ---
    const calc = document.getElementById('calc-container');

    const resizer = document.getElementById('calcResizer');

    let isDragging = false, isResizing = false;
    let startX, startY, startW, startH;

    const onMove = (e) => {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        if (isDragging) {
            calc.style.left = (clientX - startX) + 'px';
            calc.style.top = (clientY - startY) + 'px';
            calc.style.right = 'auto'; calc.style.bottom = 'auto';
        }
        if (isResizing) {
            calc.style.width = Math.max(200, startW + (clientX - startX)) + 'px';
            calc.style.height = Math.max(350, startH + (clientY - startY)) + 'px';
        }
    };
    const onEnd = () => { isDragging = isResizing = false; };

    header.onmousedown = header.ontouchstart = (e) => {
        isDragging = true;
        startX = (e.touches ? e.touches[0].clientX : e.clientX) - calc.offsetLeft;
        startY = (e.touches ? e.touches[0].clientY : e.clientY) - calc.offsetTop;
    };
    resizer.onmousedown = resizer.ontouchstart = (e) => {
        isResizing = true;
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startW = calc.offsetWidth; startH = calc.offsetHeight;

    function startRealtimeListeners() {
        // Metadata changes membuat UI ikut merefleksikan cache Firestore dan pending writes.
        db.collection('config').doc('wallets').onSnapshot({ includeMetadataChanges: true }, (s) => {
            // Jangan timpa saldo optimistik selama masih ada transaksi di durable outbox.
            if(s.exists && readOutbox().length === 0) {
                store.wallets = normalizeWallets(s.data());
                persistLocalSnapshot();
            }
            renderAll();
        }, err => console.warn('Wallet listener:', err));

        db.collection('config').doc('goal').onSnapshot({ includeMetadataChanges: true }, (s) => {
            if(s.exists && readOutbox().length === 0) {
                store.goal = Number(s.data().amount) || 0;
                persistLocalSnapshot();
            }
            renderAll();
        }, err => console.warn('Goal listener:', err));

        db.collection('config').doc('limits').onSnapshot({ includeMetadataChanges: true }, (s) => {
            if(s.exists && readOutbox().length === 0) {
                store.limits = s.data() || {};
                persistLocalSnapshot();
            }
            renderAll();
        }, err => console.warn('Limits listener:', err));

        db.collection('pengeluaran').orderBy('tanggal', 'desc').onSnapshot({ includeMetadataChanges: true }, (s) => {
            const incoming = s.docs.map(d => ({id:d.id, ...d.data()}));
            const emptyUnprimedOfflineCache = !navigator.onLine && s.metadata.fromCache && incoming.length === 0 && store.trans.length > 0;
            if (!emptyUnprimedOfflineCache) {
                store.trans = readOutbox().length ? mergePendingTransactions(incoming) : incoming;
                persistLocalSnapshot();
            }
            renderAll();
        }, err => console.warn('Transactions listener:', err));
    }

    // Pulihkan mirror lokal SEBELUM Firestore mencoba konek. Jadi offline reload tidak mulai dari nol.
    restoreLocalSnapshot();
    renderAll();

    // Persistence diaktifkan sebelum listener Firestore dibuat. Jika gagal (mis. multi-tab),
    // mirror localStorage tetap menjadi fallback dan listener cloud tetap dijalankan.
    db.enablePersistence({ synchronizeTabs: true })
        .catch((err) => {
            if (err && err.code === 'failed-precondition') console.warn('Persistence: lebih dari satu tab aktif.');
            else if (err && err.code === 'unimplemented') console.warn('Persistence tidak didukung browser ini.');
            else console.warn('Persistence warning:', err);
        })
        .then(() => { startRealtimeListeners(); flushOutbox(); });

    function updateNetworkStatus() {
        const badge = document.getElementById('statusBadge');
        if (!badge) return;
        const online = navigator.onLine;
        const pending = readOutbox().length;
        if (!online) badge.textContent = pending ? `Offline · ${pending} antre` : 'Offline';
        else if (syncInProgress || pending) badge.textContent = `Sync · ${pending}`;
        else if (lastSyncError) badge.textContent = 'Sync gagal';
        else badge.textContent = 'Online';
        badge.classList.toggle('status-online', online && !lastSyncError);
        badge.classList.toggle('status-offline', !online || !!lastSyncError);
    }
    window.addEventListener('online', () => { updateNetworkStatus(); flushOutbox(); });
    window.addEventListener('offline', updateNetworkStatus);

    window.addEventListener('load', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('t-date').value = today;
        document.getElementById('filterMonth').value = today.slice(0, 7);
        renderAll();
        if(localStorage.getItem('agis_privacy') === 'true') window.togglePrivacy();
        if(localStorage.getItem('agis_theme') === 'light') document.body.classList.add('light-mode');
        updateNetworkStatus();
        lucide.createIcons();

        // PWA registration sebelumnya belum ada di v19.8.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js').catch(err => console.error('Service Worker:', err));
        }
    });
</script>
</body>
</html>
